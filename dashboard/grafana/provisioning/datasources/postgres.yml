apiVersion: 1

datasources:
  - name: PostgreSQL (heartbeat_monitoring)
    uid: heartbeat-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: heartbeat_monitoring
    user: postgres
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: postgres
