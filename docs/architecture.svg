<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 10; }
    .box-alt { fill: #fef6e7; stroke: #b7791f; stroke-width: 2; rx: 10; }
    .box-db { fill: #eafaf1; stroke: #2f855a; stroke-width: 2; rx: 10; }
    .title { font-size: 22px; font-weight: bold; fill: #1a202c; }
    .label { font-size: 15px; font-weight: 600; fill: #1a202c; }
    .sub { font-size: 12px; fill: #4a5568; }
    .arrow { stroke: #2d3748; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .note { font-size: 12px; fill: #744210; font-style: italic; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2d3748" />
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="title">
    Real-Time Customer Heart Beat Monitoring — How Data Flows
  </text>

  <!-- 1. Generator -->
  <rect x="20" y="90" width="150" height="90" class="box" />
  <text x="95" y="125" text-anchor="middle" class="label">Data Simulator</text>
  <text x="95" y="145" text-anchor="middle" class="sub">Invents realistic</text>
  <text x="95" y="160" text-anchor="middle" class="sub">heart-rate readings</text>

  <line x1="170" y1="135" x2="215" y2="135" class="arrow" />

  <!-- 2. Producer -->
  <rect x="220" y="90" width="150" height="90" class="box" />
  <text x="295" y="120" text-anchor="middle" class="label">Kafka Producer</text>
  <text x="295" y="140" text-anchor="middle" class="sub">Streams each reading</text>
  <text x="295" y="155" text-anchor="middle" class="sub">the instant it's made</text>

  <line x1="370" y1="135" x2="415" y2="135" class="arrow" />

  <!-- 3. Kafka Topic -->
  <rect x="420" y="90" width="150" height="90" class="box-alt" />
  <text x="495" y="120" text-anchor="middle" class="label">Kafka Topic</text>
  <text x="495" y="140" text-anchor="middle" class="sub">"heartbeat-readings"</text>
  <text x="495" y="155" text-anchor="middle" class="sub">holds the live feed</text>

  <line x1="570" y1="135" x2="615" y2="135" class="arrow" />

  <!-- 4. Consumer / validation -->
  <rect x="620" y="90" width="170" height="90" class="box" />
  <text x="705" y="115" text-anchor="middle" class="label">Kafka Consumer</text>
  <text x="705" y="135" text-anchor="middle" class="sub">Reads each reading and</text>
  <text x="705" y="150" text-anchor="middle" class="sub">flags anything medically</text>
  <text x="705" y="165" text-anchor="middle" class="sub">implausible</text>

  <line x1="790" y1="135" x2="835" y2="135" class="arrow" />

  <!-- 5. Database -->
  <rect x="840" y="90" width="140" height="90" class="box-db" />
  <text x="910" y="120" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="910" y="140" text-anchor="middle" class="sub">Permanent, searchable</text>
  <text x="910" y="155" text-anchor="middle" class="sub">record of every reading</text>

  <!-- Dashboard branch -->
  <line x1="910" y1="180" x2="910" y2="260" class="arrow" />
  <rect x="820" y="265" width="180" height="80" class="box-alt" />
  <text x="910" y="295" text-anchor="middle" class="label">Grafana Dashboard</text>
  <text x="910" y="315" text-anchor="middle" class="sub">(optional) turns the data</text>
  <text x="910" y="330" text-anchor="middle" class="sub">into readable charts</text>

  <!-- Dropped-message note -->
  <text x="705" y="200" text-anchor="middle" class="note">
    A reading that can't be read at all is dropped here —
  </text>
  <text x="705" y="216" text-anchor="middle" class="note">
    every drop is written to the system log with the reason.
  </text>

  <text x="500" y="400" text-anchor="middle" class="sub">
    Every step above writes what it did to a log file, so the whole journey of one reading can always be traced.
  </text>
</svg>
